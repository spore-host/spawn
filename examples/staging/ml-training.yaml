# Machine Learning Training against a Staged Dataset, across Regions
#
# Trains one ensemble member per row, each in its own region, against a copy
# of the training dataset you have already staged in that region (spawn stage
# was removed in #805: copy it once per region with aws s3 cp, or use an FSx
# data-repository association via --fsx-import-path). Reading an in-region
# copy avoids paying cross-region transfer for every instance that reads it.
#
# Use with (from the repo root):
#   spawn launch --param-file examples/staging/ml-training.yaml --sweep-name ml-training \
#     --s3-read my-training-data-us-east-1 --s3-read my-training-data-us-west-2 \
#     --s3-read my-training-data-eu-west-1 --s3-write my-results
#
# Only defaults:, grid: and params: are read at the top level of a param file
# (spawn#530). A row's region overrides the default; its other keys reach the
# instance as $PARAM_<key> (here $PARAM_data_bucket and $PARAM_seed), and
# SWEEP_ID / SWEEP_INDEX name the sweep and the row. The rows train
# independently: a sweep does not wire instances together, so this is an
# ensemble, not one distributed job (for that, see --count with --mpi).

defaults:
  instance_type: p3.2xlarge  # 1x V100 GPU
  spot: true
  ttl: 12h
  on_complete: terminate
  command: |
    set -e
    mkdir -p /mnt/data && cd /mnt/data

    # The dataset staged in this row's region
    echo "Fetching training data from s3://${PARAM_data_bucket}..."
    aws s3 cp "s3://${PARAM_data_bucket}/imagenet-2012.tar.gz" training.tar.gz
    tar xzf training.tar.gz

    pip3 install torch torchvision --quiet

    # Train one ensemble member (bring your own train.py)
    echo "Training ensemble member ${SWEEP_INDEX} (seed ${PARAM_seed})..."
    python3 /opt/train.py \
      --data /mnt/data/imagenet/ \
      --seed "${PARAM_seed}" \
      --batch-size 256 \
      --epochs 90 \
      --output /tmp/model.pt

    aws s3 cp /tmp/model.pt "s3://my-results/models/${SWEEP_ID}/member-${SWEEP_INDEX}.pt"
    echo "Training complete"

params:
  - region: us-east-1
    data_bucket: my-training-data-us-east-1
    seed: 1
  - region: us-west-2
    data_bucket: my-training-data-us-west-2
    seed: 2
  - region: eu-west-1
    data_bucket: my-training-data-eu-west-1
    seed: 3
