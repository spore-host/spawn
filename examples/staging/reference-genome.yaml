# Genomics Analysis against a Staged Reference Genome
#
# Aligns and calls variants for each sample against a reference genome you
# have already staged where the instances can read it (spawn stage was removed
# in #805: copy it with aws s3 cp, or use an FSx data-repository association
# via --fsx-import-path). One row per sample; add rows for more samples.
#
# Use with (from the repo root):
#   spawn launch --param-file examples/staging/reference-genome.yaml --sweep-name genome-analysis
#
# Only defaults:, grid: and params: are read at the top level of a param file
# (spawn#530). Each row's sample_id reaches the instance as $PARAM_sample_id.
# The instance can read and write only spawn's own buckets unless you add
# --s3-read my-samples --s3-write my-results (or an --iam-policy) at launch.

defaults:
  region: us-east-1
  instance_type: r5.2xlarge  # Memory-optimized
  spot: true
  ttl: 4h
  on_complete: terminate
  command: |
    set -e
    REFERENCE="/mnt/data/reference.fasta"  # the staged reference (hg38, ~100GB)
    SAMPLE_ID="${PARAM_sample_id}"
    echo "Analyzing sample ${SAMPLE_ID}..."

    # Download sample FASTQ from S3
    aws s3 cp "s3://my-samples/sample-${SAMPLE_ID}.fastq" .

    # Install BWA and samtools
    sudo yum install -y bwa samtools bcftools

    # Align, sort, call variants
    bwa mem -t 8 "$REFERENCE" "sample-${SAMPLE_ID}.fastq" > aligned.sam
    samtools view -bS aligned.sam | samtools sort -o sorted.bam
    bcftools mpileup -f "$REFERENCE" sorted.bam | bcftools call -mv > variants.vcf

    # Upload results
    aws s3 cp variants.vcf "s3://my-results/sample-${SAMPLE_ID}.vcf"
    echo "Sample ${SAMPLE_ID} complete"

params:
  - sample_id: 1
  - sample_id: 2
  - sample_id: 3
  - sample_id: 4
