name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # keyless cosign signing (Fulcio/Rekor) + spored KMS OIDC + provenance
  attestations: write   # actions/attest-build-provenance (SLSA)

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    env:
      # Every region spawn publishes spored and the bootstrap body to.
      SPAWN_BINARY_BUCKETS: >-
        spawn-binaries-us-east-1
        spawn-binaries-us-east-2
        spawn-binaries-us-west-1
        spawn-binaries-us-west-2
        spawn-binaries-ca-central-1
        spawn-binaries-eu-west-1
        spawn-binaries-eu-west-2
        spawn-binaries-eu-central-1
        spawn-binaries-ap-southeast-1
        spawn-binaries-ap-southeast-2
        spawn-binaries-ap-northeast-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'

      # cosign for keyless CLI-artifact signing (the .goreleaser signs: block runs
      # `cosign sign-blob --bundle` over checksums.txt with this job's OIDC identity).
      # This is separate from spored's KMS signing in the S3-upload step below.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Hard-fail the tag if the committed reference (docs-gen/) is stale, so a
      # release can never ship a reference that lags the code. Same check as CI's
      # drift gate, run here as a pre-release guard.
      - name: Docs reference drift guard
        run: make check-docs

      # Hard-fail the tag if the binaries wouldn't report the tag they're built
      # from. The version is injected by an -X ldflag, which the linker accepts
      # silently even when the target symbol doesn't exist — so a renamed
      # variable or module path would publish binaries that call themselves
      # "dev", with no other signal. Also refuses to publish with CHANGELOG.md
      # still saying [Unreleased].
      - name: Release version guard
        run: scripts/check-release-version.sh "${GITHUB_REF_NAME}"

      # The static Linux bootstrap body (#1274), published BEFORE GoReleaser
      # publishes the CLI and the taps. A release build of spawn puts only a stub
      # in user data; the stub fetches spawn/versions/<v>/bootstrap.sh from the
      # instance's regional bucket (us-east-1 fallback) and runs it only if its
      # sha256 is the one that build expects AND its .sig verifies against the key
      # compiled into spawn; otherwise the instance terminates itself. So no
      # installable spawn may exist before its body does. Generated from the
      # tagged source with the release's version ldflag; after GoReleaser, the
      # "released spawn prints the published body" step proves the shipped
      # binary prints the same bytes. Not optional, unlike the spored signature
      # below: an unsigned or missing body would retire every launch.
      - name: Configure AWS credentials (bootstrap body)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::966362334030:role/GitHubActions-spore-host-release
          role-session-name: bootstrap-body-upload
          aws-region: us-east-1

      - name: Publish the bootstrap body to S3
        env:
          SPORED_SIGNING_KEY_ID: ${{ vars.SPORED_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          read -ra BUCKETS <<< "$SPAWN_BINARY_BUCKETS"
          if [ "${#BUCKETS[@]}" -eq 0 ]; then
            echo "::error::SPAWN_BINARY_BUCKETS is empty"
            exit 1
          fi
          if [ -z "${SPORED_SIGNING_KEY_ID:-}" ]; then
            echo "::error::SPORED_SIGNING_KEY_ID unset: the bootstrap body must be signed, or every launch by this release retires itself at boot (#1274)"
            exit 1
          fi
          # Outside the checkout: GoReleaser refuses a dirty tree.
          out="${RUNNER_TEMP}/spawn-bootstrap-body"
          mkdir -p "$out"
          SPORE_NO_UPDATE_CHECK=1 CGO_ENABLED=0 go run -ldflags "-X github.com/spore-host/spawn/cmd.Version=${VERSION}" . bootstrap-body > "$out/bootstrap.sh"
          if [ ! -s "$out/bootstrap.sh" ]; then
            echo "::error::spawn bootstrap-body printed nothing (#1274)"
            exit 1
          fi
          sha256sum "$out/bootstrap.sh" | awk '{print $1}' > "$out/bootstrap.sh.sha256"
          # KMS signs the 32-byte digest (--message-type DIGEST); the result
          # verifies with `openssl dgst -sha256 -verify`, as spored's does.
          openssl dgst -sha256 -binary "$out/bootstrap.sh" > "$out/bootstrap.sh.digest"
          aws kms sign \
            --key-id "$SPORED_SIGNING_KEY_ID" \
            --message-type DIGEST \
            --signing-algorithm ECDSA_SHA_256 \
            --message "fileb://$out/bootstrap.sh.digest" \
            --query Signature --output text \
            > "$out/bootstrap.sh.sig"
          if [ ! -s "$out/bootstrap.sh.sig" ]; then
            echo "::error::KMS returned no signature for the bootstrap body (#1274)"
            exit 1
          fi
          for bucket in "${BUCKETS[@]}"; do
            region="${bucket#spawn-binaries-}"
            for f in bootstrap.sh bootstrap.sh.sig bootstrap.sh.sha256; do
              aws s3 cp "$out/$f" "s3://${bucket}/spawn/versions/${VERSION}/$f" --region "$region" --only-show-errors
            done
          done
          echo "✅ Published the bootstrap body ($(cat "$out/bootstrap.sh.sha256")) to ${#BUCKETS[@]} regions"

      # spored, built, signed and published to spawn/versions/<v>/ BEFORE
      # GoReleaser makes the CLI installable (#1415). A release spawn installs
      # spored only from its own version's directory and retires the instance
      # when it is missing or its .sig does not verify (#1412), so, as with the
      # body above, no installable spawn may exist before its spored does.
      #
      # GoReleaser OSS cannot build in one step and publish in a later one
      # (`release --skip=publish` has no OSS counterpart that publishes the
      # prepared dist/; split/continue/publish and the prebuilt builder are Pro),
      # so this builds spored itself with EXACTLY the spored build in
      # .goreleaser.yaml: same env, ldflags, package and targets, no extra flags
      # (TestReleaseBuildsSporedLikeGoReleaser parses both). Go builds are
      # reproducible here: same toolchain, same checkout path, and the same
      # clean tree, so the same vcs.* stamps. Hence the output goes OUTSIDE the
      # checkout: an untracked file in the tree flips vcs.modified and changes
      # every byte-hash. After GoReleaser, "Check GoReleaser built the published
      # spored" fails the job if dist/'s spored differs from what was published.
      - name: Build spored for the release
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          out="${RUNNER_TEMP}/spored-release"
          mkdir -p "$out"
          # GOOS GOARCH name: .goreleaser.yaml's spored goos x goarch, minus its ignore.
          while read -r goos goarch name; do
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -ldflags "-s -w -X main.Version=${VERSION}" -o "$out/$name" ./cmd/spored
            sha256sum "$out/$name" | awk '{print $1}' > "$out/$name.sha256"
          done <<'TARGETS'
          linux amd64 spored-linux-amd64
          linux arm64 spored-linux-arm64
          windows amd64 spored-windows-amd64.exe
          TARGETS
          echo "✅ Built spored ${VERSION}: $(cd "$out" && cat ./*.sha256 | tr '\n' ' ')"

      - name: Publish the versioned spored to S3
        env:
          SPORED_SIGNING_KEY_ID: ${{ vars.SPORED_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          out="${RUNNER_TEMP}/spored-release"
          read -ra BUCKETS <<< "$SPAWN_BINARY_BUCKETS"
          if [ -z "${SPORED_SIGNING_KEY_ID:-}" ]; then
            echo "::error::SPORED_SIGNING_KEY_ID unset: a release spawn installs only a signed spored, so every launch by this release would retire itself at boot (#1412)"
            exit 1
          fi
          # The key the released spawn verifies against, from the tagged source.
          SPORE_NO_UPDATE_CHECK=1 CGO_ENABLED=0 go run . spored-signing-key > "$out/signing-key.pem"
          for name in spored-linux-amd64 spored-linux-arm64 spored-windows-amd64.exe; do
            # KMS Sign takes at most ~4 KiB, so sign the 32-byte digest
            # (--message-type DIGEST); `openssl dgst -sha256 -verify` over the file
            # accepts it, as the installer does (#440).
            openssl dgst -sha256 -binary "$out/$name" > "$out/$name.digest"
            aws kms sign \
              --key-id "$SPORED_SIGNING_KEY_ID" \
              --message-type DIGEST \
              --signing-algorithm ECDSA_SHA_256 \
              --message "fileb://$out/$name.digest" \
              --query Signature --output text \
              > "$out/$name.sig"
            # Refuse to publish a signature the released spawn would reject.
            openssl base64 -d -A -in "$out/$name.sig" > "$out/$name.sig.der"
            if ! openssl dgst -sha256 -verify "$out/signing-key.pem" -signature "$out/$name.sig.der" "$out/$name" >/dev/null; then
              echo "::error::the KMS signature of $name does not verify against the key compiled into spawn; every launch by this release would retire itself at boot (#1415)"
              exit 1
            fi
          done
          # Every bucket in SPAWN_BINARY_BUCKETS, us-east-1 (the fallback) included:
          # a regional copy left stale and unsigned once beat the fallback and
          # broke spored installs region-wide (#440). One "src<NUL>dest" pair per
          # object, through a bounded parallel pool; any failed copy fails xargs
          # and so the step.
          # shellcheck disable=SC2016 # $1/$2 expand in xargs' bash, not here
          for bucket in "${BUCKETS[@]}"; do
            for name in spored-linux-amd64 spored-linux-arm64 spored-windows-amd64.exe; do
              for f in "$name" "$name.sha256" "$name.sig"; do
                printf '%s\0%s\0' "$out/$f" "s3://${bucket}/spawn/versions/${VERSION}/$f"
              done
            done
          done | xargs -0 -P 16 -n 2 bash -c 'b="${2#s3://}"; b="${b%%/*}"; aws s3 cp "$1" "$2" --region "${b#spawn-binaries-}" --only-show-errors' _
          echo "✅ Published the signed spored ${VERSION} to spawn/versions/${VERSION}/ in ${#BUCKETS[@]} regions"

      # Read every versioned object back and require the bytes just published.
      # A copy that "succeeded" into the wrong key or region, or a bucket whose
      # policy drops the write, would otherwise surface only as launches retiring.
      - name: Verify the published versioned spored
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          out="${RUNNER_TEMP}/spored-release"
          back="${RUNNER_TEMP}/spored-readback"
          read -ra BUCKETS <<< "$SPAWN_BINARY_BUCKETS"
          # shellcheck disable=SC2016 # $1/$2 expand in xargs' bash, not here
          for bucket in "${BUCKETS[@]}"; do
            mkdir -p "$back/$bucket"
            for name in spored-linux-amd64 spored-linux-arm64 spored-windows-amd64.exe; do
              for f in "$name" "$name.sha256" "$name.sig"; do
                printf '%s\0%s\0' "s3://${bucket}/spawn/versions/${VERSION}/$f" "$back/$bucket/$f"
              done
            done
          done | xargs -0 -P 16 -n 2 bash -c 'b="${1#s3://}"; b="${b%%/*}"; aws s3 cp "$1" "$2" --region "${b#spawn-binaries-}" --only-show-errors' _
          bad=0
          for bucket in "${BUCKETS[@]}"; do
            for name in spored-linux-amd64 spored-linux-arm64 spored-windows-amd64.exe; do
              for f in "$name" "$name.sha256" "$name.sig"; do
                if ! cmp -s "$out/$f" "$back/$bucket/$f"; then
                  echo "::error::s3://${bucket}/spawn/versions/${VERSION}/$f is not the object just published (#1415)"
                  bad=1
                fi
              done
            done
          done
          [ "$bad" = 0 ] || exit 1
          rm -rf "$back"  # ~2 GiB; GoReleaser needs the runner's disk next
          echo "✅ Verified the versioned spored ${VERSION} in ${#BUCKETS[@]} regions"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}

      # The shipped linux binary must print exactly the body published above:
      # its stub refuses any other bytes, so a mismatch would retire every launch
      # it makes. Runs even when GoReleaser failed late (the tap push), because
      # the binaries are published by then.
      - name: Check the released spawn prints the published body
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/spawn-bootstrap-body"
          want="$(cat "$out/bootstrap.sh.sha256")"
          got="$(SPORE_NO_UPDATE_CHECK=1 dist/spawn_linux_amd64_v1/spawn bootstrap-body | sha256sum | awk '{print $1}')"
          if [ -z "$want" ] || [ "$got" != "$want" ]; then
            echo "::error::the released spawn prints a bootstrap body with sha256 ${got}, but ${want:-nothing} was published; every launch by this release would retire itself at boot (#1274)"
            exit 1
          fi
          echo "✅ The released spawn's bootstrap body matches the published one ($got)"

      # GoReleaser's spored (the GitHub release archives, the .deb/.rpm) must be
      # the bytes published to spawn/versions/ before it ran. They are, as long
      # as both builds stay identical (see "Build spored for the release"); a
      # change to one and not the other lands here, loudly, rather than as two
      # different spored for one version. Runs even when GoReleaser failed late
      # (the tap push), because the binaries are published by then.
      - name: Check GoReleaser built the published spored
        id: spored-dist-match
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/spored-release"
          bad=0
          for pair in \
            "spored-linux-amd64:dist/spored_linux_amd64_v1/spored" \
            "spored-linux-arm64:dist/spored_linux_arm64_v8.0/spored" \
            "spored-windows-amd64.exe:dist/spored_windows_amd64_v1/spored.exe"; do
            name="${pair%%:*}"; built="${pair#*:}"
            want="$(cat "$out/$name.sha256")"
            got="$(sha256sum "$built" 2>/dev/null | awk '{print $1}')" || got=""
            if [ -z "$want" ] || [ "$got" != "$want" ]; then
              echo "::error::GoReleaser built $built with sha256 ${got:-<missing>}, but spawn/versions/ holds $name ${want:-<nothing>}: the release ships two different spored, and the pre-GoReleaser build no longer matches .goreleaser.yaml (#1415)"
              bad=1
            fi
          done
          [ "$bad" = 0 ] || exit 1
          echo "✅ GoReleaser's spored is byte-identical to the published versioned spored"

      # SLSA build provenance for the CLI release archives (complements the cosign
      # signature — signature authenticates the publisher, attestation records how/
      # where it was built). Attests checksums.txt, which covers every artifact by
      # hash. Runs only on a successful GoReleaser build (dist/checksums.txt exists).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/checksums.txt'

      # The current spored, spawn/current/spored-*, which dev builds of spawn
      # install (#1419). Moved only once this release is published: after the
      # GitHub release exists and its spored is the one in spawn/versions/, so
      # current never names a release that failed to publish. Not gated on
      # GoReleaser's own success, so an expired tap token (spawn#280), which
      # fails GoReleaser after the GitHub release is up, still moves it. Copies
      # the files signed and verified before GoReleaser; nothing is rebuilt or
      # re-signed here.
      #
      # The unversioned spawn/spored-* and bucket-root spored-* keys are NOT
      # written, from v0.150.0 on: they stay at v0.149.0, the last spored that
      # reads the launch-fixed settings from tags (#1359), because spawn
      # releases before v0.149.0 install them and must keep a spored that reads
      # what they write. TestReleaseNeverWritesTheFrozenLatest holds it.
      - name: Configure AWS credentials
        if: ${{ !cancelled() && steps.spored-dist-match.outcome == 'success' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::966362334030:role/GitHubActions-spore-host-release
          role-session-name: spored-s3-upload
          aws-region: us-east-1

      - name: Update the current spored
        if: ${{ !cancelled() && steps.spored-dist-match.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/spored-release"
          read -ra BUCKETS <<< "$SPAWN_BINARY_BUCKETS"
          draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" || draft=""
          if [ "$draft" != "false" ]; then
            echo "::error::the GitHub release ${GITHUB_REF_NAME} is not published (isDraft=${draft:-<no release>}); leaving the current spored on the previous release"
            exit 1
          fi
          # shellcheck disable=SC2016 # $1/$2 expand in xargs' bash, not here
          for bucket in "${BUCKETS[@]}"; do
            for name in spored-linux-amd64 spored-linux-arm64 spored-windows-amd64.exe; do
              for f in "$name" "$name.sha256" "$name.sig"; do
                printf '%s\0%s\0' "$out/$f" "s3://${bucket}/spawn/current/$f"
              done
            done
          done | xargs -0 -P 16 -n 2 bash -c 'b="${2#s3://}"; b="${b%%/*}"; aws s3 cp "$1" "$2" --region "${b#spawn-binaries-}" --only-show-errors' _
          echo "✅ The current spored (spawn/current/) is now ${GITHUB_REF_NAME} in ${#BUCKETS[@]} regions"

      # Nudge the umbrella docs repo to vendor this release's generated reference
      # (docs/gen/spawn/). Fires repository_dispatch → sync-cli-docs.yaml, which
      # opens a PR; merging deploys. Needs a cross-repo PAT (DOCS_SYNC_TOKEN) —
      # the default GITHUB_TOKEN can't dispatch to another repo. If the secret is
      # absent the step skips cleanly: the sync workflow's weekly schedule is the
      # backstop, so a missing token never fails a release.
      - name: Notify docs site of new release
        if: ${{ !cancelled() }}
        env:
          DOCS_SYNC_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          if [ -z "${DOCS_SYNC_TOKEN:-}" ]; then
            echo "DOCS_SYNC_TOKEN not set — skipping docs dispatch (weekly sync will catch up)."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${DOCS_SYNC_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/spore-host/spore-host/dispatches \
            -d '{"event_type":"cli-docs-updated","client_payload":{"cli":"spawn"}}'
          echo "✅ Dispatched cli-docs-updated (spawn) to the docs repo"
