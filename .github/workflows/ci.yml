name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Force bundled Node 20 actions (e.g. github-script inside
# codecov-action@v5) onto Node 24 ahead of GitHub's 2026-06-16 cutover.
# Belt-and-suspenders to the orion runner's /home/runner/.env (spore-host#345);
# this also covers GitHub-hosted fallback runs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'

      # Formatting gate. Runs first because it's the cheapest check and the
      # fastest to act on. CI had no formatting check at all, and `make check`
      # runs `gofmt -w` — it rewrites files and always succeeds, so it never
      # gated anything. Three files sat unformatted on main for months, showing
      # up as unrelated diffs in whatever PR ran `make check` next.
      #
      # gofmt walks paths, not modules, so this covers lambda/* too.
      - name: Format gate
        run: make check-fmt

      # Changelog gate. CLAUDE.md requires an entry under `## [Unreleased]` in the
      # SAME PR as any user-facing change, and the release ritual promotes that
      # section verbatim. Nothing enforced it, and #627 merged with no entry at all —
      # found only at the next release, which hit an EMPTY [Unreleased] and had to
      # reconstruct the entries from the diff at tag time.
      #
      # PR-only: it needs the base branch to know what changed. The FORMAT half
      # (duplicate groups, invalid group names, missing compare links) is a plain Go
      # test in changelog_test.go, so it runs on push and locally too.
      #
      # Deliberately not a hard failure on every path: a PR that only touches tests,
      # CI config, or docs-gen output has nothing user-facing to describe. The check
      # looks at whether any Go source outside _test.go changed, which is the
      # closest cheap proxy for "a user could notice this".
      - name: Changelog gate
        if: github.event_name == 'pull_request'
        env:
          # Via env, never interpolated into the script body: `${{ github.* }}` inside
          # a `run:` block is a shell-injection vector, and Semgrep's
          # run-shell-injection rule blocks it (correctly — it caught this).
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail

          # The checkout is shallow, and a depth-1 fetch has no common ancestor, so
          # `git diff base...HEAD` dies with "no merge base" (exit 128) before any of
          # the logic below runs — which would fail EVERY pull request rather than the
          # non-compliant ones. Deepen enough to find the merge base, then diff from it
          # explicitly so the failure is detectable instead of fatal.
          git fetch --no-tags --quiet --depth=100 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true

          if ! base=$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null); then
            # A gate must fail on a KNOWN violation, not on its own inability to
            # measure one. If the merge base is unreachable (a very long-lived branch,
            # a force-pushed base), warn and pass rather than block work on an
            # infrastructure quirk.
            echo "::warning::Could not determine the merge base against $BASE_REF; skipping the changelog presence check."
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)

          code=$(echo "$changed" | grep -E '\.go$' | grep -vE '_test\.go$' | grep -vE '^docs-gen/' || true)
          if [ -z "$code" ]; then
            echo "No non-test Go changes; changelog entry not required."
            exit 0
          fi
          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated alongside the code change."
            exit 0
          fi

          echo "::error::This PR changes Go source but does not touch CHANGELOG.md."
          echo
          echo "Add an entry under '## [Unreleased]' in the right group (Added/Changed/"
          echo "Deprecated/Removed/Fixed/Security, or Documentation for docs-only)."
          echo "Describe the user-visible effect, not the implementation."
          echo
          echo "Why this is a gate: the release ritual promotes [Unreleased] verbatim, so a"
          echo "missing entry is not noticed until tag time — when the change has to be"
          echo "reconstructed from the diff by whoever is cutting the release."
          echo
          echo "If this genuinely has no user-visible effect (a pure refactor, a test-only"
          echo "helper), say so in an '### Changed' entry or in the PR description and add the"
          echo "file anyway — one line costs less than the archaeology."
          echo
          echo "Non-test Go files changed:"
          echo "$code" | sed 's/^/  /'
          exit 1

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -short -coverprofile=coverage.out ./...

      - name: Race detector (pkg/agent)
        # The agent runs a monitor loop + background goroutines; guard the
        # Agent.config access (2026-06 audit M-corr) against regressions.
        run: go test -race -count=1 ./pkg/agent/...

      - name: Coverage gate
        env:
          # Ratchet floor — must not drop below this. Raise it as coverage
          # improves; target is 60% (see CLAUDE.md). Current: ~26.5%.
          MIN_COVERAGE: '26'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}% (floor: ${MIN_COVERAGE}%)"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit !(t+0 >= m+0) }' \
            || { echo "::error::coverage ${total}% is below floor ${MIN_COVERAGE}%"; exit 1; }

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: coverage.out
          fail_ci_if_error: false

      - name: Vet
        run: go vet ./...

      # Docs drift gate: the committed command/flag reference (docs-gen/) is
      # generated from the CLI via `gen-docs`. Regenerate and fail if it's stale,
      # so a flag/command change can't merge without its reference update. The
      # umbrella docs site vendors docs-gen/ from the release tag.
      - name: Docs reference drift gate
        run: make check-docs

      # The lambda/* directories are each their own Go module, so the root
      # `go test ./...` above does NOT descend into them — their tests would
      # otherwise never run in CI (#136). Build, vet, and test each one.
      - name: Lambda modules (build + vet + test)
        run: |
          set -e
          fail=0
          for mod in $(find lambda -name go.mod -maxdepth 2 | sort); do
            dir=$(dirname "$mod")
            echo "::group::$dir"
            ( cd "$dir" && go build ./... && go vet ./... && go test -short ./... ) || fail=1
            echo "::endgroup::"
          done
          exit $fail

  # Tier 0 E2E — the real spawn binary driven against the Substrate AWS
  # emulator. No AWS account/credentials; exercises the full CLI surface
  # (args → cobra → AWS client → Substrate) and asserts JSON, exit codes, and
  # emulator state. Cheap and deterministic, so it runs on every push/PR.
  e2e-tier0:
    name: E2E Tier 0 (Substrate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'

      - name: Build spawn binary
        run: go build -o bin/spawn .

      - name: Tier 0 tests
        run: go test -tags=e2e_tier0 -timeout 30m ./test/e2e/
