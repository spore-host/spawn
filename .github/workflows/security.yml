name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # weekly Monday 08:00 UTC

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - name: Install govulncheck
        # Pinned: govulncheck v1.4.0 panics ("ForEachElement called on type
        # containing *types.TypeParam") analyzing generics, so @latest crashes the
        # scan (exit 1, not a vulnerability finding). v1.3.0 is the last release
        # that handles generic code. Bump once the upstream regression is fixed.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Scan all modules
        run: |
          # govulncheck is per-module; scan the root and every nested go.mod
          # (the Lambda submodules pin their own deps).
          set -e
          fail=0
          for mod in $(find . -name go.mod -not -path '*/vendor/*' | sort); do
            dir=$(dirname "$mod")
            echo "::group::govulncheck $dir"
            ( cd "$dir" && govulncheck ./... ) || fail=1
            echo "::endgroup::"
          done
          exit $fail

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so leaked-then-removed secrets are caught. This also
          # fetches every other branch; the scan below is scoped to HEAD so those
          # are not scanned (#1024).
          fetch-depth: 0
      # Run the gitleaks BINARY directly (MIT-licensed, free for orgs). The
      # gitleaks-action wrapper requires a paid license for GitHub organizations,
      # which we don't use. Non-zero exit on leaks.
      # Verified before it runs (#885). This binary decides whether secrets are
      # present, and it ran as `curl | tar` with nothing checked — half a pin: a
      # pinned version with no pinned hash runs a replaced release asset
      # unnoticed. The hash is pinned HERE rather than read from the release's
      # checksums.txt, because a file fetched alongside the download can be
      # replaced alongside it. Cross-checked against the published
      # gitleaks_8.21.2_checksums.txt when pinned.
      #
      # Upgrading gitleaks changes .gitleaks.toml's allowlist semantics — read the
      # note at the top of that file and migrate it in the same change.
      - name: Install gitleaks
        run: |
          VER=8.21.2
          SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          T="gitleaks_${VER}_linux_x64.tar.gz"
          curl -sSLf -o "/tmp/$T" "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/$T"
          echo "$SHA256  /tmp/$T" | sha256sum -c -
          tar -xzf "/tmp/$T" -C /usr/local/bin gitleaks
          gitleaks version
      # Scan every commit reachable from HEAD, and only those (#1024). With no
      # --log-opts gitleaks runs `git log --all`, which with fetch-depth 0 is every
      # branch in the repo: one open PR's finding (real or false positive) turned
      # every other PR's Secret Scan red until that branch was force-pushed, and
      # people learned to re-run the job until it passed. HEAD is the commit under
      # test: on pull_request the refs/pull/N/merge commit, whose ancestry is main
      # plus every commit in the PR (so a secret added and then removed inside the
      # PR is still caught); on push and schedule, main's tip.
      - name: gitleaks scan (history of HEAD)
        run: gitleaks git --log-opts="HEAD" --redact --verbose --exit-code 1 .

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (vulns + secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Trivy config scan (IaC misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Enforcing: fails the build on findings. Triaged false-positives are
      # annotated inline with `# nosemgrep: <rule-id> -- <reason>` (#368).
      - name: Semgrep scan
        run: semgrep scan --config=auto --error .
