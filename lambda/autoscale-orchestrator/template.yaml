AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]
    Description: Deployment environment

  EC2RoleArn:
    Type: String
    Default: 'arn:aws:iam::435415984226:role/spawn-autoscale-ec2'
    Description: ARN of the cross-account EC2 management role in spore-host-dev

  Version:
    Type: String
    Default: unknown
    Description: >
      The spawn version this artifact was built from, stamped onto the function as
      the spawn:version tag so an operator can read it in ONE API call (spawn#654).
      Nothing synchronises this stack with the CLI, so version skew is the normal
      state — and until now it was invisible, answerable only by comparing the
      function's LastModified against git log. `unknown` means it was deployed by
      something that did not stamp it.

  LogRetentionDays:
    Type: Number
    Default: 30
    Description: >
      Days to keep this function's CloudWatch logs. Configurable, but it has a
      default on purpose: a log group that Lambda auto-creates on first invocation
      has NO retention and keeps logs forever. A footprint audit found 10 such
      groups holding 51 MB in the infra account — the only artifact in the control
      plane measured to grow without bound (#653). Declaring the group here with a
      retention is what stops that, so this must stay set.

  ScheduleRate:
    Type: String
    Default: rate(1 minute)
    Description: >
      How often the orchestrator reconciles autoscale groups. One minute is a
      responsiveness figure, and it is worth revisiting per environment: this
      stack polled every minute from February to October 2026 against an EMPTY
      groups table — 10,080 invocations a week, finding nothing (#772).

  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >
      Whether the reconciliation schedule runs. Default ENABLED, so this
      parameter changes nothing unless set.
      Note the spelling: it is SAM's `State`, NOT `Enabled`. `Enabled: !Ref …`
      silently does not work — SAM resolves it as
      `"ENABLED" if self.Enabled else "DISABLED"`
      (samtranslator/model/eventsources/push.py:162), and at transform time a
      !Ref is an intrinsic DICT, which is always truthy in Python. So an
      Enabled-based parameter yields ENABLED for every value including 'false',
      and `sam validate --lint` accepts it. `State` is passed through verbatim.
      It exists because the rule is CLOUDFORMATION-MANAGED
      (AutoScaleOrchestratorFunctionScheduleEvent), so `aws events disable-rule`
      would be stack drift and would be silently reverted by the next deploy —
      the same trap as spawn#754's update-function-code. Turning the schedule off
      is therefore a DEPLOY, not a CLI call.
      Setting this false leaves the function deployed and reachable; `spawn
      autoscale status` then reports the schedule as DISABLED and names the
      remedy (spawn#772/#773), so the feature is inert rather than silently
      broken.

Resources:
  AutoScaleOrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub spawn-autoscale-orchestrator-${Environment}
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      # build/ holds ONLY the bootstrap binary. `sam deploy` zips this directory
      # with no filtering of any kind (samcli/lib/package/utils.py: os.walk, dotfiles
      # included) and there is no .samignore feature, so `CodeUri: .` shipped the dev
      # binary, a nested function.zip, and every source file — 75.7 MiB deployed for a
      # ~7 MiB artifact (spawn#645).
      CodeUri: build/
      MemorySize: 512
      Timeout: 900
      Environment:
        Variables:
          AUTOSCALE_GROUPS_TABLE: !Ref AutoScaleGroupsTable
          HYBRID_REGISTRY_TABLE: spawn-hybrid-registry
          EC2_ROLE_ARN: !Ref EC2RoleArn
          EC2_EXTERNAL_ID: spawn-autoscale-orchestrator
          SPAWN_VERSION: !Ref Version
      # Readable without invoking the function (spawn#654). Mirrors
      # pkg/reaperdeploy.Tags so every spore.host lambda answers the same
      # question the same way.
      Tags:
        spawn:managed: 'true'
        spawn:component: autoscale-orchestrator
        spawn:created-by: sam deploy
        spawn:version: !Ref Version
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AutoScaleGroupsTable
        - DynamoDBCrudPolicy:
            TableName: spawn-hybrid-registry
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Ref EC2RoleArn
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:spawn-autoscale-orchestrator-${Environment}
        - Statement:
            - Effect: Allow
              Action:
                - sqs:GetQueueAttributes
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:GetMetricStatistics
              Resource: '*'
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleRate
            State: !Ref ScheduleState

  AutoScaleGroupsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub spawn-autoscale-groups-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: autoscale_group_id
          AttributeType: S
      KeySchema:
        - AttributeName: autoscale_group_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: spore-host

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/spawn-autoscale-orchestrator-${Environment}
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  FunctionArn:
    Description: ARN of the autoscale orchestrator Lambda function
    Value: !GetAtt AutoScaleOrchestratorFunction.Arn
    Export:
      Name: !Sub ${Environment}-autoscale-orchestrator-arn

  TableName:
    Description: Name of the autoscale groups DynamoDB table
    Value: !Ref AutoScaleGroupsTable
    Export:
      Name: !Sub ${Environment}-autoscale-groups-table
