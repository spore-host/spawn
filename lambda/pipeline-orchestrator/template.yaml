AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Spawn Pipeline Orchestrator Lambda Function

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - production
      - staging
      - development
    Description: Environment name

  Version:
    Type: String
    Default: unknown
    Description: >
      The spawn version this artifact was built from, stamped onto the function as
      the spawn:version tag so an operator can read it in ONE API call (spawn#654).
      Nothing synchronises this stack with the CLI, so version skew is the normal
      state — and until now it was invisible, answerable only by comparing the
      function's LastModified against git log. `unknown` means it was deployed by
      something that did not stamp it.

  LogRetentionDays:
    Type: Number
    Default: 30
    Description: >
      Days to keep this function's CloudWatch logs. Configurable, but it has a
      default on purpose: a log group that Lambda auto-creates on first invocation
      has NO retention and keeps logs forever. A footprint audit found 10 such
      groups holding 51 MB in the infra account — the only artifact in the control
      plane measured to grow without bound (#653). Declaring the group here with a
      retention is what stops that, so this must stay set.

Resources:
  # DynamoDB table for pipeline state
  PipelineOrchestrationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: spawn-pipeline-orchestration
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pipeline_id
          AttributeType: S
      KeySchema:
        - AttributeName: pipeline_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: spawn
        - Key: Component
          Value: pipeline-orchestrator

  # Lambda function
  PipelineOrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: spawn-pipeline-orchestrator
      # Explicit, because OMITTING CodeUri is not a reprieve: ServerlessFunctionResource
      # inherits PACKAGE_NULL_PROPERTY = True, and upload_local_artifacts documents
      # "If path is omitted, this method will zip the current working folder and upload."
      # So this packaged whatever cwd happened to be (spawn#645).
      CodeUri: build/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 900  # 15 minutes (max)
      Environment:
        Variables:
          SPAWN_PIPELINE_ORCHESTRATION_TABLE: !Ref PipelineOrchestrationTable
          ENVIRONMENT: !Ref Environment
      Policies:
        # DynamoDB access
        - DynamoDBCrudPolicy:
            TableName: !Ref PipelineOrchestrationTable
        # S3 access for pipeline definitions and data
        - S3ReadPolicy:
            BucketName: '*'
        - S3CrudPolicy:
            BucketName: '*'
        # EC2 permissions for launching instances
        - Statement:
            - Effect: Allow
              Action:
                - ec2:RunInstances
                - ec2:DescribeInstances
                - ec2:DescribeInstanceStatus
                - ec2:DescribeAvailabilityZones
                - ec2:DescribeSecurityGroups
                - ec2:CreateSecurityGroup
                - ec2:DeleteSecurityGroup
                - ec2:AuthorizeSecurityGroupIngress
                - ec2:RevokeSecurityGroupIngress
                - ec2:CreatePlacementGroup
                - ec2:DeletePlacementGroup
                - ec2:DescribePlacementGroups
                - ec2:CreateTags
                - ec2:TerminateInstances
              Resource: '*'
        # IAM pass role for EC2 instances
        - Statement:
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource:
                - 'arn:aws:iam::*:role/spawnd-role'
                - 'arn:aws:iam::*:role/spored-instance-role'
        # Lambda self-invocation (wildcard to avoid circular dependency)
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:spawn-pipeline-orchestrator*'
        # SSM parameter access for AMI lookup
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: 'arn:aws:ssm:*:*:parameter/aws/service/ami-*'
      Tags:
        Environment: !Ref Environment
        Application: spawn
        Component: pipeline-orchestrator
        # Readable without invoking the function (spawn#654).
        spawn:managed: 'true'
        spawn:component: pipeline-orchestrator
        spawn:created-by: sam deploy
        spawn:version: !Ref Version

  # CloudWatch Log Group with retention
  PipelineOrchestratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/spawn-pipeline-orchestrator
      RetentionInDays: !Ref LogRetentionDays

  # EventBridge rule for scheduled execution (optional) - Commented out to avoid circular dependency
  # Can be added manually if needed
  # PipelineOrchestratorScheduleRule:
  #   Type: AWS::Events::Rule
  #   Properties:
  #     Name: spawn-pipeline-orchestrator-schedule
  #     Description: Periodic invocation for long-running pipelines
  #     State: DISABLED
  #     ScheduleExpression: rate(5 minutes)
  #     Targets:
  #       - Arn: !GetAtt PipelineOrchestratorFunction.Arn
  #         Id: PipelineOrchestratorTarget
  #
  # PipelineOrchestratorSchedulePermission:
  #   Type: AWS::Lambda::Permission
  #   Properties:
  #     FunctionName: !Ref PipelineOrchestratorFunction
  #     Action: lambda:InvokeFunction
  #     Principal: events.amazonaws.com
  #     SourceArn: !GetAtt PipelineOrchestratorScheduleRule.Arn

Outputs:
  PipelineOrchestratorFunctionArn:
    Description: ARN of the Pipeline Orchestrator Lambda function
    Value: !GetAtt PipelineOrchestratorFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-FunctionArn

  PipelineOrchestrationTableName:
    Description: Name of the DynamoDB table for pipeline orchestration
    Value: !Ref PipelineOrchestrationTable
    Export:
      Name: !Sub ${AWS::StackName}-TableName

  PipelineOrchestratorFunctionName:
    Description: Name of the Pipeline Orchestrator Lambda function
    Value: !Ref PipelineOrchestratorFunction
    Export:
      Name: !Sub ${AWS::StackName}-FunctionName
