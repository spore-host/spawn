AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  spawn TTL reaper — out-of-band backstop that terminates spawn-managed EC2
  instances past their spawn:ttl-deadline (or a hard max-age ceiling), even when
  the in-instance spored daemon is dead. Backstop, NOT a replacement for spored.
  See spore-host/spawn#70, #71.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging]
    Description: Deployment environment

  RoleArns:
    Type: CommaDelimitedList
    Default: 'arn:aws:iam::435415984226:role/spawn-ttl-reaper-ec2'
    Description: >
      Cross-account EC2 reaper role ARNs — ONE PER ACCOUNT that spawn launches
      spores into. A spore lands in whatever account the caller's credentials
      point at, so list every such account's role here. Deploy
      ttl-reaper-cross-account-role.yaml in each account to create these.

  ScanSelf:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Also scan the Lambda's OWN account directly (no assume-role). Set true if
      spores are launched in the infra account too.

  Regions:
    Type: String
    Default: 'us-east-1,us-east-2,us-west-1,us-west-2,ca-central-1,eu-west-1,eu-west-2,eu-central-1,ap-southeast-1,ap-southeast-2,ap-northeast-1'
    Description: Comma-separated regions to scan (defaults to the 11 release-bucket regions)

  MaxAge:
    Type: String
    Default: '168h'
    Description: Hard max-age ceiling (Go duration); reaps ANY instance older than this, including one inside a far-future spawn:ttl-deadline — the deadline is instance-writable, so the ceiling is the tamper defence

  TtlGrace:
    Type: String
    Default: ''
    Description: >
      How long past its TTL deadline a RUNNING instance whose spored still
      checks in (spawn:last-heartbeat under 10 minutes old) is left for spored
      to end itself, which it does after flushing the task's command.log and
      completion record (#1186). A pkg/ttl duration from 0 to 1h. '' (default)
      is 10m; 0 reaps at the deadline, as before this parameter existed. A
      stale or missing heartbeat, or a stopped instance, is always reaped at
      the deadline, and MaxAge still applies. An invalid value means the
      default.

  DryRun:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: When true, log "WOULD reap" + notify without terminating. Start true; flip to false after verifying.

  NotifyUrl:
    Type: String
    Default: ''
    Description: Slack-incoming-webhook URL for reap notifications (optional but recommended)

  Schedule:
    Type: String
    Default: 'rate(10 minutes)'
    Description: EventBridge schedule expression for the reaper

  DnsZoneId:
    Type: String
    Default: ''
    Description: >
      Route53 hosted zone ID for instance DNS (e.g. Z0341053304H0DQXF6U4X). When
      set together with DnsDomain, the reaper deletes a reaped instance's DNS
      records (#247) — spored's graceful DeleteDNS never ran. The zone is in the
      reaper's OWN account. Empty disables DNS teardown.

  DnsDomain:
    Type: String
    Default: ''
    Description: Domain for the hosted zone above (e.g. spore.host). Empty disables DNS teardown.

  DnsExtraZoneIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >
      Further Route53 hosted zone IDs the reaper's DNS work covers, beyond DnsZoneId
      (#1065): custom zones spores register in with --dns-domain (#891). Each zone's
      domain is read from the zone itself, so only IDs are given. Teardown, the DNS
      sweep, the unmanaged-subdomain report and lease expiry all cover them. Needs
      DnsZoneId and DnsDomain. Empty covers the primary zone only.

  DnsSweep:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      When true (and a zone is configured), the reaper also runs a DNS
      reconciliation sweep (#438): it lists each account's {base36}.{domain}
      A-records and deletes any whose IP has no live instance — catching records
      orphaned by abrupt exits (crash / out-of-band terminate / fast spot reclaim)
      that the instance-driven #247 teardown can't. Honors DryRun. Off by default.

  NetResources:
    Type: String
    Default: 'report'
    AllowedValues: ['off', 'report', 'reap']
    Description: >
      Reclamation of spawn-managed security groups and cluster placement groups
      that no instance references and that are older than 7 days (#685). Neither
      bills, but both consume a per-VPC quota that bites at LAUNCH time, and a
      rejected --mpi launch used to leave one of each behind on every attempt.

      Three values rather than true/false, and NOT folded into DryRun, because
      production runs DryRun=false: a boolean would have armed a brand-new
      destructive sweep the moment the Lambda was updated, and the only way to
      preview it would have been to turn OFF the live instance reaper — trading an
      untested delete for a disarmed TTL backstop. Same reasoning as DnsExpire
      below.

      'report' (default) describes and logs what it WOULD reclaim and deletes
      nothing, so an upgrade is observable but inert. 'reap' deletes, and should be
      set only after the report has been read. 'off' skips the sweep entirely, for
      an account where someone else owns these resources. An unrecognised value
      resolves to 'report' — a typo must not arm a delete. DryRun always wins.

      Elastic IPs spawn allocated for a multi-interface EFA launch are NOT
      governed by this parameter; see ElasticIps.

  ElasticIps:
    Type: String
    Default: ''
    AllowedValues: ['', 'off', 'report', 'reap']
    Description: >
      The orphaned launch Elastic IP sweep (#661, #1232), independent of
      NetResources. It selects addresses tagged spawn:managed=true,
      spawn:purpose=efa-public-ip and spawn:instance-id, and releases one only
      when it is unassociated, its instance is terminated or gone, and its
      spawn:created stamp (or, without one, the reaper's own first-seen stamp)
      is at least 15 minutes old. Such an address bills by the hour and counts
      against the per-region Elastic IP quota; a Spot reclaim of a
      multi-interface EFA instance leaves one behind every time.

      '' (default) keeps the behaviour from before this parameter existed:
      'reap', unless NetResources is 'off', in which case 'off'. So a stack
      redeployed without naming it behaves exactly as it did. 'reap' releases
      the address, and also releases the address of an instance the reaper has
      just terminated. 'report' logs each address 'reap' would release and
      releases nothing. 'off' skips both. An unrecognised value resolves to
      'report'. DryRun always wins.

  SpotRequests:
    Type: String
    Default: 'report'
    AllowedValues: ['off', 'report', 'reap']
    Description: >
      The orphaned persistent Spot request sweep (#950). A --spot launch with a
      stop-based lifecycle makes a persistent request. If its instance is ended
      outside spawn (the console, aws ec2 terminate-instances), the request
      reopens and EC2 launches untagged replacements. The sweep cancels
      spawn-tagged persistent requests whose instance is gone, replaced or
      expired, and terminates a replacement after cancelling its request. Staged
      like NetResources and for the same reason: 'report' (default) logs and
      notifies what it WOULD do, 'reap' acts, 'off' skips it. An unrecognised
      value resolves to 'report'. DryRun always wins.

  DnsExpire:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      When true (and DnsSweep is on), the reaper DELETES the A-records under an
      unmanaged account subdomain that the portal registry has proven eligible —
      dormant (emptiness proven through a working role) or offboarded (a human said
      so). See spore-host/spawn#466. Requires DnsSweep, since the unmanaged-subdomain
      walk runs inside the sweep.

      Separate from DnsSweep on purpose: DnsSweep is already on in production, so
      folding this into it would make an existing flag destructive on upgrade for a
      class of records it has never touched. Honors DryRun. OFF by default, and it
      should stay off until the report has been read: spored registers DNS once at
      boot, so a wrongly deleted A-record never self-heals — the spore keeps running
      and is simply unreachable by name until it reboots.

  DnsLeaseExpire:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Expire DNS records whose owner has stopped renewing their lease, for account
      subdomains this reaper does NOT cover (pkg/dns/lease.go). The only backstop
      for a record left by an abruptly terminated instance in an account spore.host
      holds no credentials in. Requires DnsSweep. Arrives off: the stale count is
      reported either way, and arming it is a separate decision.
  AccountsTable:
    Type: String
    Default: 'spore-portal-accounts'
    Description: >
      The portal account registry DynamoDB table (in the reaper's own account),
      whose lifecycle status supplies the expiry verdict. Read-only — the prober
      owns every write. Only read when DnsExpire or the sweep is on.

  AccountsTableKeyArn:
    Type: String
    Default: ''
    Description: >
      KMS CMK ARN encrypting the registry table above. DynamoDB SSE with a CMK
      requires the caller to hold kms:Decrypt on the key, so a Scan fails without
      this even with dynamodb:Scan granted. Empty omits the grant (for a table on
      an AWS-owned key).

  AlarmsEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Create the CloudWatch metric filters and alarms that make the reaper's
      FAILURES visible (spore-host/spawn#469). Until these existed the reaper had no
      observability at all: the handler always returns success, so the Lambda Errors
      metric never moved; the Slack webhook only fires on a successful reap; and the
      Summary went to one log line nothing reads. A run whose every scan failed was
      indistinguishable from a run with nothing to reap — which is the exact
      blindness the reaper was created (#65) to prevent. On by default; leave it on.

  AlarmTopicArn:
    Type: String
    Default: ''
    Description: >
      SNS topic ARN to notify when an alarm fires. Optional, but an alarm nobody is
      told about only helps someone who already suspected a problem and went looking
      — which is the state this whole change exists to fix. Empty creates the alarms
      with no action, so they are visible in the console but will page no one.

  Version:
    Type: String
    Default: unknown
    Description: >
      The spawn version this artifact was built from, stamped onto the function as
      the spawn:version tag so an operator can read it in ONE API call (spawn#654).
      Nothing synchronises this stack with the CLI — a `sam deploy` is the only
      thing that moves it — so version skew is the NORMAL state, and until now it
      was invisible: this stack sat untouched from 2026-07-31 to 2026-10-04 while
      the CLI went from ~v0.9x to v0.116.0, missing three merged fixes, and nothing
      anywhere said so. Answering "is the deployed reaper current?" required
      comparing the function's LastModified against `git log -- lambda/ttl-reaper/`,
      which is archaeology rather than a check.
      Passed explicitly by the Makefile on every deploy. `unknown` means it was
      deployed by something that did not stamp it.

  LogRetentionDays:
    Type: Number
    Default: 30
    Description: >
      Days to keep this function's CloudWatch logs. Configurable, but it has a
      default on purpose: a log group that Lambda auto-creates on first invocation
      has NO retention and keeps logs forever. A footprint audit found 10 such
      groups holding 51 MB in the infra account — the only artifact in the control
      plane measured to grow without bound (#653). Declaring the group here with a
      retention is what stops that, so this must stay set.

Conditions:
  ScanSelfEnabled: !Equals [!Ref ScanSelf, 'true']
  RegistryReadEnabled: !And
    - !Not [!Equals [!Ref DnsZoneId, '']]
    - !Not [!Equals [!Ref DnsDomain, '']]
    - !Equals [!Ref DnsSweep, 'true']
  TableKeyProvided: !And
    - !Not [!Equals [!Ref AccountsTableKeyArn, '']]
    - !Condition RegistryReadEnabled
  DnsTeardownEnabled: !And
    - !Not [!Equals [!Ref DnsZoneId, '']]
    - !Not [!Equals [!Ref DnsDomain, '']]
  DnsExtraZonesEnabled: !And
    - !Condition DnsTeardownEnabled
    - !Not [!Equals [!Join ['', !Ref DnsExtraZoneIds], '']]
  ObservabilityEnabled: !Equals [!Ref AlarmsEnabled, 'true']
  AlarmActionsEnabled: !And
    - !Not [!Equals [!Ref AlarmTopicArn, '']]
    - !Condition ObservabilityEnabled

Resources:
  TTLReaperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub spawn-ttl-reaper-${Environment}
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      # build/ holds ONLY the bootstrap binary. `sam deploy` zips this directory
      # with no filtering of any kind (samcli/lib/package/utils.py: os.walk, dotfiles
      # included) and there is no .samignore feature, so `CodeUri: .` shipped the dev
      # binary, a nested function.zip, and every source file — 75.7 MiB deployed for a
      # ~7 MiB artifact (spawn#645).
      CodeUri: build/
      MemorySize: 256
      Timeout: 900
      Environment:
        Variables:
          REAPER_ROLE_ARNS: !Join [',', !Ref RoleArns]
          REAPER_SCAN_SELF: !Ref ScanSelf
          EC2_EXTERNAL_ID: spawn-ttl-reaper
          REAPER_REGIONS: !Ref Regions
          REAPER_MAX_AGE: !Ref MaxAge
          REAPER_TTL_GRACE: !Ref TtlGrace
          REAPER_DRY_RUN: !Ref DryRun
          REAPER_NOTIFY_URL: !Ref NotifyUrl
          REAPER_DNS_ZONE_ID: !Ref DnsZoneId
          REAPER_DNS_DOMAIN: !Ref DnsDomain
          REAPER_DNS_EXTRA_ZONE_IDS: !Join [',', !Ref DnsExtraZoneIds]
          REAPER_DNS_SWEEP: !Ref DnsSweep
          REAPER_NET_RESOURCES: !Ref NetResources
          REAPER_SPOT_REQUESTS: !Ref SpotRequests
          REAPER_ELASTIC_IPS: !Ref ElasticIps
          REAPER_DNS_EXPIRE: !Ref DnsExpire
          REAPER_DNS_LEASE_EXPIRE: !Ref DnsLeaseExpire
          ACCOUNTS_TABLE: !Ref AccountsTable
          SPAWN_VERSION: !Ref Version
      # Readable without invoking the function, which is the whole point: a check
      # that has to invoke a reaper to ask its version is not a check anyone will
      # run against production. Mirrors pkg/reaperdeploy.Tags, so the self-hosted
      # and operated reapers answer the same question the same way (spawn#654).
      Tags:
        spawn:managed: 'true'
        spawn:component: ttl-reaper
        spawn:created-by: sam deploy
        spawn:version: !Ref Version
      Policies:
        # Assume each per-account role that actually describes/terminates EC2.
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Ref RoleArns
        # When scanning the Lambda's own account directly (ScanSelf=true), it
        # needs describe/terminate locally too. Terminate is tag-scoped to
        # spawn:managed=true so the reaper can never touch unmanaged instances.
        #
        # The fsx: and ssm: grants below were MISSING (#625). In cross-account mode
        # those calls run under the assumed spawn-ttl-reaper-ec2 role, which does
        # grant fsx — so the gap only ever bit ScanSelf, and silently: the reaper
        # terminated instances fine while failing to delete the orphaned filesystem
        # the #210 ephemeral net exists to catch (and that #613 was reported for).
        # pkg/reaperiam is the single source for this set. Its
        # TestSAMTemplateScanSelfPolicyMatchesReaperIAM parses this branch and fails
        # unless every statement here equals ScanSelfStatements — actions, resources
        # and conditions (#985). Edit reaperiam first, then mirror it here.
        - !If
            - ScanSelfEnabled
            - Statement:
                - Effect: Allow
                  Action:
                    - ec2:DescribeInstances
                  Resource: '*'
                - Effect: Allow
                  Action:
                    - ec2:TerminateInstances
                  Resource: '*'
                  Condition:
                    StringEquals:
                      ec2:ResourceTag/spawn:managed: 'true'
                # #922: cancel a persistent Spot request before terminating its
                # instance, or EC2 launches a replacement. Same tag rail.
                - Effect: Allow
                  Action:
                    - ec2:CancelSpotInstanceRequests
                  Resource: '*'
                  Condition:
                    StringEquals:
                      ec2:ResourceTag/spawn:managed: 'true'
                # #950: the orphaned-Spot-request sweep. Read-only, and
                # DescribeSpotInstanceRequests has no resource-level permissions.
                - Effect: Allow
                  Action:
                    - ec2:DescribeSpotInstanceRequests
                  Resource: '*'
                # #685 network-resource sweep: security groups and placement
                # groups. Read-only; neither Describe has resource-level
                # permissions. These were MISSING here (#985) — every sweep cycle
                # of a SAM-deployed ScanSelf reaper hit AccessDenied.
                - Effect: Allow
                  Action:
                    - ec2:DescribeSecurityGroups
                    - ec2:DescribePlacementGroups
                    # #661 orphaned launch Elastic IP sweep; read-only.
                    - ec2:DescribeAddresses
                  Resource: '*'
                # The destructive half, on the same tag rail as TerminateInstances.
                # CreateTags lets the sweep stamp a spawn-managed resource with its
                # first-seen time; tag-conditioned, so it cannot adopt a resource
                # that is not already spawn:managed=true.
                - Effect: Allow
                  Action:
                    - ec2:DeleteSecurityGroup
                    - ec2:DeletePlacementGroup
                    # #661: release a launch Elastic IP whose instance is gone.
                    - ec2:ReleaseAddress
                    - ec2:CreateTags
                  Resource: '*'
                  Condition:
                    StringEquals:
                      ec2:ResourceTag/spawn:managed: 'true'
                # #210 ephemeral-orphan net. FSx exposes no resource-tag condition
                # key for DeleteFileSystem, so the guard is the reaper's own check
                # (spawn:managed, no live lease, past the grace period) rather than
                # an IAM rail — worth stating plainly instead of implying otherwise.
                - Effect: Allow
                  Action:
                    - fsx:DescribeFileSystems
                    - fsx:DeleteFileSystem
                  Resource: '*'
                # REAPER_GRACEFUL asks spored to shut down cleanly over SSM before an
                # external terminate. Without these, graceful mode silently degrades
                # to an immediate terminate.
                #
                # SendCommand is scoped to spawn-managed instances plus the one
                # document the reaper names (#818, #985). It was Resource '*' with no
                # condition, which is arbitrary root shell on ANY SSM-managed instance
                # in the account. ssm:resourceTag, NOT ec2:ResourceTag: a condition key
                # belongs to the service of the ACTION, and an ec2: key is absent from
                # an ssm: request context (#652/#665).
                - Effect: Allow
                  Action:
                    - ssm:SendCommand
                  Resource: 'arn:aws:ec2:*:*:instance/*'
                  Condition:
                    StringEquals:
                      ssm:resourceTag/spawn:managed: 'true'
                # A document carries no spawn:managed tag, so it is scoped by name.
                - Effect: Allow
                  Action:
                    - ssm:SendCommand
                  Resource: 'arn:aws:ssm:*:*:document/AWS-RunShellScript'
                # No resource-level ARN; it only reads a command this role sent.
                - Effect: Allow
                  Action:
                    - ssm:GetCommandInvocation
                  Resource: '*'
            - !Ref AWS::NoValue
        # DNS teardown (#247): delete a reaped instance's Route53 records, since
        # spored's graceful DeleteDNS never ran. Scoped to the single configured
        # hosted zone; ListResourceRecordSets is zone-level (needed to read the
        # exact record set before a Route53 DELETE). Only attached when DNS
        # teardown is configured.
        - !If
            - DnsTeardownEnabled
            - Statement:
                - Effect: Allow
                  Action:
                    - route53:ChangeResourceRecordSets
                    - route53:ListResourceRecordSets
                  Resource: !Sub 'arn:aws:route53:::hostedzone/${DnsZoneId}'
            - !Ref AWS::NoValue
        # The extra zones (#1065), with the same two actions plus GetHostedZone,
        # which the reaper calls once per zone at startup to learn its domain. One
        # ARN per configured ID, built from the same list the reaper is given.
        - !If
            - DnsExtraZonesEnabled
            - Statement:
                - Effect: Allow
                  Action:
                    - route53:ChangeResourceRecordSets
                    - route53:ListResourceRecordSets
                    - route53:GetHostedZone
                  Resource: !Split
                    - ','
                    - !Join
                      - ''
                      - - 'arn:aws:route53:::hostedzone/'
                        - !Join [',arn:aws:route53:::hostedzone/', !Ref DnsExtraZoneIds]
            - !Ref AWS::NoValue
        # Portal registry read (#466): the lifecycle status that says whether an
        # unmanaged subdomain's account is provably dormant/offboarded. Scan only —
        # never UpdateItem/PutItem/DeleteItem: the prober owns every write to this
        # table, and the reaper being unable to write is what makes it impossible for
        # a reaper bug to manufacture the eligibility it then acts on.
        #
        # Attached whenever the sweep is on, not only when DnsExpire is, because the
        # verdict is REPORTED either way — reading the report is how an operator
        # decides whether enabling expiry is safe.
        - !If
            - RegistryReadEnabled
            - Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:Scan
                  Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AccountsTable}'
            - !Ref AWS::NoValue
        # DynamoDB SSE with a CMK requires the caller to hold kms:Decrypt on the
        # table key; the Scan above fails without it. Decrypt ONLY — GenerateDataKey
        # would only be needed to write, which the reaper must never do.
        - !If
            - TableKeyProvided
            - Statement:
                - Effect: Allow
                  Action:
                    - kms:Decrypt
                  Resource: !Ref AccountsTableKeyArn
            - !Ref AWS::NoValue
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: !Ref Schedule
            Enabled: true

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/spawn-ttl-reaper-${Environment}
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------------
  # Failure observability (#469, #457 failure mode A, #254 idea 3)
  #
  # The reaper's whole value is that it still reaps when spored is dead. That
  # guarantee is only as good as our ability to notice when the REAPER is the thing
  # that is dead — and until these resources existed, we could not. Every field in
  # Summary except Errors counts something that happened; Errors alone says a scan
  # did NOT happen, and nothing was listening to it.
  #
  # The patterns below match literal sentinel strings emitted by failures.go. That
  # coupling is deliberate but fragile in one direction: renaming a constant in Go
  # without editing the pattern here disarms the alarm silently. TestSentinelSpellings
  # AreStable pins the spellings so that becomes a build failure instead.
  #
  # Alarms live here, with the function, rather than in spore-host's OpenTofu (where
  # the prober's live) so that the alarm and the log line it matches ship in the same
  # repo and the same `make deploy`. Splitting them across repos is how #254's class
  # of drift starts.
  # ---------------------------------------------------------------------------

  # THE alarm that matters: a run that reached ZERO accounts. It concluded nothing
  # and reaped nothing, which from the outside looks exactly like a quiet, healthy
  # run over a fleet with nothing expired.
  ReachedNoAccountsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: ObservabilityEnabled
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '"REAPER REACHED NO ACCOUNTS"'
      MetricTransformations:
        - MetricName: ReaperReachedNoAccounts
          MetricNamespace: !Sub spawn/ttl-reaper/${Environment}
          MetricValue: '1'
          # Without a default the metric is simply absent on healthy runs, and
          # "absent" and "zero" are not the same thing to an alarm.
          DefaultValue: 0

  ReachedNoAccountsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ObservabilityEnabled
    Properties:
      AlarmName: !Sub spawn-ttl-reaper-${Environment}-reached-no-accounts
      AlarmDescription: >
        The TTL reaper reached ZERO accounts in a run: every account × region scan
        failed. It therefore reaped nothing, and over-deadline instances may be
        running right now with nothing left to stop them (#65's failure mode, one
        layer up).

        Investigate OUR side FIRST, not the customers. The most likely causes, in
        order: (1) this Lambda's execution role lost its sts:AssumeRole grant;
        (2) the reaper stack was recreated — its role ARN embeds a
        CloudFormation-generated physical ID, so a new stack changes the suffix and
        breaks EVERY customer's trust policy simultaneously (spawn#457), which looks
        identical to the entire customer base uninstalling at once; (3) EC2_EXTERNAL_ID
        no longer matches the cross-account roles' ExternalId condition.

        Check the log line "REAPER REACHED NO ACCOUNTS" for the account count, and the
        per-region "scan error" lines above it for the classified reason.
      Namespace: !Sub spawn/ttl-reaper/${Environment}
      MetricName: ReaperReachedNoAccounts
      Statistic: Sum
      # An hour of runs (6 at the default rate(10 minutes)), twice, before paging.
      # A single failed run can be a transient regional blip; two consecutive hours
      # of reaching nothing cannot.
      Period: 3600
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # A period with no data means no run emitted the sentinel — healthy. The
      # separate InvocationErrors alarm below is what catches "no runs at all".
      TreatMissingData: notBreaching
      AlarmActions: !If [AlarmActionsEnabled, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']
      OKActions: !If [AlarmActionsEnabled, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']

  # One account refused us in every region. Lower urgency than the above — the rest
  # of the fleet is still being reaped — but it is a standing misconfiguration that
  # will never fix itself, and before #469 it was invisible: it just added 11 to a
  # counter nobody read.
  AccountUnreachableMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: ObservabilityEnabled
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '"REAPER ACCOUNT UNREACHABLE"'
      MetricTransformations:
        - MetricName: ReaperAccountUnreachable
          MetricNamespace: !Sub spawn/ttl-reaper/${Environment}
          MetricValue: '1'
          DefaultValue: 0

  AccountUnreachableAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ObservabilityEnabled
    Properties:
      AlarmName: !Sub spawn-ttl-reaper-${Environment}-account-unreachable
      AlarmDescription: >
        A cross-account role refused the TTL reaper in EVERY region, so that
        account's instances are not being reaped at all. The rest of the fleet is
        unaffected.

        Causes: the spawn-ttl-reaper-ec2 role was deleted, its trust policy no longer
        names this reaper's execution role, or EC2_EXTERNAL_ID changed. STS answers
        AccessDenied for all three and deliberately does not distinguish them, so as
        not to leak whether the role exists.

        This is NOT proof the customer offboarded. If the account really is gone,
        remove its ARN from RoleArns — the reaper keeps trying every run until you do,
        by design: it must never quietly stop watching an account that might come
        back (spawn#457). The log line names the account and, when the portal registry
        has a row for it, includes that registry status as corroboration — note the
        registry describes the spore-portal-onboard role, not this one, so it is a
        second opinion about a different door and never authoritative.

        Sustained over a day: fix the role or drop the account.
      Namespace: !Sub spawn/ttl-reaper/${Environment}
      MetricName: ReaperAccountUnreachable
      Statistic: Sum
      # A full day before paging: this is chronic, not acute, and the fleet is still
      # being reaped. Paging hourly on a standing misconfiguration is how the old
      # Errors counter got ignored in the first place.
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [AlarmActionsEnabled, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']
      OKActions: !If [AlarmActionsEnabled, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']

  # FSx has its own signal because fsx:* is a separate grant from ec2:*. An account
  # can scan instances perfectly and never reclaim a filesystem — which is spawn#212
  # exactly, an FSx AccessDenied that presented as a silent no-op. Sharing the
  # account-level signal would let the EC2 success mask it again.
  FSxUnreachableMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: ObservabilityEnabled
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '"REAPER FSX UNREACHABLE"'
      MetricTransformations:
        - MetricName: ReaperFSxUnreachable
          MetricNamespace: !Sub spawn/ttl-reaper/${Environment}
          MetricValue: '1'
          DefaultValue: 0

  FSxUnreachableAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ObservabilityEnabled
    Properties:
      AlarmName: !Sub spawn-ttl-reaper-${Environment}-fsx-unreachable
      AlarmDescription: >
        An account's role refused every FSx DescribeFileSystems call, so orphaned
        spawn-managed FSx Lustre filesystems in it are never being reclaimed. Those
        cost real money per GB-month for as long as this lasts, and nothing else in
        the system will ever delete them.

        This fires INDEPENDENTLY of the account-unreachable alarm on purpose: fsx:* is
        a separate grant from ec2:*, so the usual shape of this is an account whose
        instance scan works fine. That combination is spawn#212, where an FSx
        AccessDenied surfaced as a silent no-op because the path was best-effort and
        under-logged (spawn#254's recurring class).

        Fix: add fsx:DescribeFileSystems (and fsx:DeleteFileSystem) to that account's
        spawn-ttl-reaper-ec2 role — see ttl-reaper-cross-account-role.yaml. The log
        line names the account and says whether its instance scan succeeded.
      Namespace: !Sub spawn/ttl-reaper/${Environment}
      MetricName: ReaperFSxUnreachable
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [AlarmActionsEnabled, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']
      OKActions: !If [AlarmActionsEnabled, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']

  # The Spot-request sweep (#950) is a separate grant from the instance scan,
  # so its denial needs its own signal, as FSx's does (#212).
  SpotRequestsUnreachableMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: ObservabilityEnabled
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '"REAPER SPOT REQUESTS UNREACHABLE"'
      MetricTransformations:
        - MetricName: ReaperSpotRequestsUnreachable
          MetricNamespace: !Sub spawn/ttl-reaper/${Environment}
          MetricValue: '1'
          DefaultValue: 0

  SpotRequestsUnreachableAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ObservabilityEnabled
    Properties:
      AlarmName: !Sub spawn-ttl-reaper-${Environment}-spot-requests-unreachable
      AlarmDescription: >
        An account's role refused every ec2:DescribeSpotInstanceRequests, so the
        sweep for orphaned persistent Spot requests (#950) is not running there.
        A request left open by a terminate outside spawn keeps launching
        replacement instances, untagged and unreaped, until it is cancelled.

        Fix: redeploy that account's spawn-ttl-reaper-ec2 stack from
        ttl-reaper-cross-account-role.yaml, which grants it.
      Namespace: !Sub spawn/ttl-reaper/${Environment}
      MetricName: ReaperSpotRequestsUnreachable
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [AlarmActionsEnabled, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']
      OKActions: !If [AlarmActionsEnabled, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']

  # A replacement instance launched by a leaked persistent request, which the
  # reaper could not terminate (#950). It is billing, untagged, and invisible to
  # spawn list. The request is already cancelled. A human has to end it.
  SpotReplacementStrandedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: ObservabilityEnabled
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '"SPOT REPLACEMENT NOT TERMINATED"'
      MetricTransformations:
        - MetricName: ReaperSpotReplacementStranded
          MetricNamespace: !Sub spawn/ttl-reaper/${Environment}
          MetricValue: '1'
          DefaultValue: 0

  SpotReplacementStrandedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ObservabilityEnabled
    Properties:
      AlarmName: !Sub spawn-ttl-reaper-${Environment}-spot-replacement-stranded
      AlarmDescription: !Sub >
        A persistent Spot request spawn made launched a replacement instance after
        its original was terminated outside spawn, and the reaper could not
        terminate it. The request is already cancelled, so nothing more launches,
        but the instance bills until a person terminates it. To act: in log group
        /aws/lambda/spawn-ttl-reaper-${Environment}, filter for
        "SPOT REPLACEMENT NOT TERMINATED". Each line names the account, region,
        instance and Spot request, and gives two commands. Run the
        describe-instances check, which must print the request id, then the
        terminate-instances command, both with credentials for that account. The
        reaper cannot do this itself: the replacement is untagged, its
        TerminateInstances grant is scoped to spawn:managed=true, and no IAM
        condition key ties an instance to its Spot request (spawn#984).
      Namespace: !Sub spawn/ttl-reaper/${Environment}
      MetricName: ReaperSpotReplacementStranded
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [AlarmActionsEnabled, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']
      OKActions: !If [AlarmActionsEnabled, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']

  # spored stopped ticking on a RUNNING instance (#682). Unlike every sentinel
  # above, this one is about the in-instance agent rather than the reaper's own
  # reach: the instance is still billing, and the TTL/idle/cost limits spored
  # enforces locally are no longer being enforced at all. The reaper is then the
  # only thing that will ever stop it.
  SporedQuietMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: ObservabilityEnabled
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '"SPORED NOT CHECKING IN"'
      MetricTransformations:
        - MetricName: SporedQuiet
          MetricNamespace: !Sub spawn/ttl-reaper/${Environment}
          MetricValue: '1'
          DefaultValue: 0

  SporedQuietAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ObservabilityEnabled
    Properties:
      AlarmName: !Sub spawn-ttl-reaper-${Environment}-spored-quiet
      AlarmDescription: >
        A running spawn-managed instance stopped refreshing spawn:last-heartbeat, so
        spored started and then died. TTL, idle-stop and cost limits are enforced IN
        the instance, so none of them are being enforced now — this reaper's deadline
        scan is the only thing left that will terminate it.

        The reported shape (spawn#682) is a starved instance: 0.5 GiB of RAM, wedged
        during a package install, still running at TWICE its 6-minute TTL with no
        signal of any kind, indistinguishable from a long-running job. v0.121.0's
        memory-floor warning prevents that launch; this makes it observable when it
        happens anyway.

        Deliberately NOT a reap trigger: a wedged agent on a healthy workload is a
        diagnosis, not a deadline. The log line names the instance, account, region
        and how far behind it is. Usually out of memory — check spored's journal via
        SSM, and terminate by hand if the work is lost.
      Namespace: !Sub spawn/ttl-reaper/${Environment}
      MetricName: SporedQuiet
      Statistic: Sum
      # Three consecutive runs, so a single lost tag write or a throttled
      # TagResources call does not page anyone. A genuinely wedged agent keeps
      # emitting this every run until the instance is reaped or killed.
      Period: 3600
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [AlarmActionsEnabled, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']
      OKActions: !If [AlarmActionsEnabled, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']

  # A run that dies outright — panic, timeout, OOM, a bad deploy — never reaches the
  # code that emits any sentinel above, so those alarms stay silent precisely when
  # things are worst. This one covers that gap and needs no log parsing.
  InvocationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ObservabilityEnabled
    Properties:
      AlarmName: !Sub spawn-ttl-reaper-${Environment}-invocation-errors
      AlarmDescription: >
        The TTL reaper Lambda itself failed to complete — panic, timeout (900s cap),
        out-of-memory, or a broken deploy. Nothing was reaped on those runs.

        This alarm exists because the sentinel-based alarms above are emitted BY the
        handler: a run that dies before finishing emits none of them, so without this
        the loudest failure would be the quietest signal. Check the log group for a
        panic trace or a Task timed out message.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TTLReaperFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [AlarmActionsEnabled, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']
      OKActions: !If [AlarmActionsEnabled, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']

  # The four alarms above all use TreatMissingData: notBreaching, correctly —
  # no sentinel datapoint genuinely is good news. But that means a reaper that
  # never runs at all (EventBridge rule disabled, schedule deleted or target
  # detached, reserved concurrency set to 0, or the function deleted outright)
  # produces ZERO breaching datapoints across every alarm above, so all four
  # sit contentedly in OK while nothing is being enforced. InvocationErrors
  # doesn't cover it either: AWS/Lambda Errors requires an invocation to
  # produce a datapoint at all — no invocation, no error, no alarm.
  #
  # This is the one alarm in this template where TreatMissingData: breaching
  # is correct, precisely because it inverts every other alarm's logic here:
  # for this alarm alone, absence of data IS the failure being detected.
  # Period is 1800s (~3 missed ticks at the default rate(10 minutes)) so a
  # single skipped invocation doesn't page, but the reaper going fully silent
  # is caught within the hour rather than passing unnoticed indefinitely.
  NotInvokedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ObservabilityEnabled
    Properties:
      AlarmName: !Sub spawn-ttl-reaper-${Environment}-not-invoked
      AlarmDescription: >
        The TTL reaper has not been invoked AT ALL in the last ~30 minutes —
        not "ran and failed" (that's …-invocation-errors), but never started.
        Every other alarm in this stack requires an invocation to produce a
        datapoint, so this is the last unmonitored link in the chain:
        "something is running the reaper."

        Causes: the EventBridge schedule rule was disabled (manually, or by a
        failed deploy), the schedule was deleted or its target detached,
        reserved concurrency was set to 0, or the function itself was deleted.
        Check the EventBridge rule's State and the function's
        ReservedConcurrentExecutions first.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref TTLReaperFunction
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      # The inversion is the entire point of this alarm: no invocations means
      # the reaper isn't running, which is the failure — not a quiet period.
      TreatMissingData: breaching
      AlarmActions: !If [AlarmActionsEnabled, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']
      OKActions: !If [AlarmActionsEnabled, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']

Outputs:
  FunctionArn:
    Description: ARN of the TTL reaper Lambda function
    Value: !GetAtt TTLReaperFunction.Arn
    Export:
      Name: !Sub ${Environment}-ttl-reaper-arn
  FunctionRoleArn:
    Description: Execution role ARN (trust this in the dev-account cross-account role)
    Value: !GetAtt TTLReaperFunctionRole.Arn
