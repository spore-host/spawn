AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'spore-bot — Slack/Teams/Discord/SMS chat interface for instance control (spore.host + prism)'

# SELF-HOSTING ONLY. This is the first-time setup for running your own spore-bot.
# It is NOT how hosted spore.host deploys it: there the bot's code lives in the
# spore-host repo (lambda/spore-bot, shipped with `make deploy`), its shape
# (role, runtime, arch, memory, timeout, Function URL) is OpenTofu-managed at
# spore-host's infra/tofu/spore-bot, and there has been no CloudFormation stack
# since 2026-06-14. Do not deploy this template into the hosted infra account.
#
# Audited against spore-host's lambda/spore-bot on 2026-10-15 (spawn#1043): every
# env var the code reads is either a parameter below, set by the template, or
# AWS_LAMBDA_FUNCTION_NAME (Lambda sets it). The code is in another repo, so no
# gate here keeps the two in step — re-audit when the bot gains an env var or an
# AWS call.
#
# Secrets are NoEcho parameters. On a stack UPDATE pass each one with
# UsePreviousValue=true (or re-supply it): a parameter omitted from an update
# resets to its default, which here is empty, and the bot fails closed without
# it (see docs/infra-account.md, "Known traps").

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging, development]

  LambdaCodeBucket:
    Type: String
    Default: ''
    Description: S3 bucket containing Lambda zip (leave empty to skip Lambda deployment)

  LambdaCodeKey:
    Type: String
    Default: spore-bot/function.zip  # what spore-host's lambda/spore-bot `make upload` writes
    Description: S3 key of the Lambda zip within LambdaCodeBucket

  # ── Bot configuration (env vars read by lambda/spore-bot) ────────────────────

  SlashCommand:
    Type: String
    Default: /spore
    Description: BOT_SLASH_COMMAND — fallback slash command when a payload carries none. Also selects TWILIO_NUMBER_<COMMAND> for SMS.

  ConnectCodeTTLHours:
    Type: String
    Default: '24'
    Description: BOT_CONNECT_CODE_TTL_HOURS — platform default; workspace admins can lower it per workspace.

  DiscordPublicKey:
    Type: String
    Default: ''
    Description: DISCORD_PUBLIC_KEY — the Discord application's Ed25519 public key (hex). Empty disables Discord.

  SlackSigningSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: SLACK_SIGNING_SECRET — app-level fallback for OAuth-installed workspaces, which store no per-workspace secret. Signature verification fails closed when both are empty.

  BotOAuthSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: BOT_OAUTH_SECRET — HMAC key for the OAuth state parameter. Required for /<platform>/oauth; the flow fails closed when empty or "change-me".

  SlackClientId:
    Type: String
    Default: ''
    Description: SPORE_SLACK_CLIENT_ID — Slack OAuth client id for the /spore/oauth install flow. The code reads <PLATFORM>_SLACK_CLIENT_ID, so a second app (e.g. PRISM_*) needs its own env vars.

  SlackClientSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: SPORE_SLACK_CLIENT_SECRET — Slack OAuth client secret for the /spore/oauth install flow.

  OAuthSuccessUrl:
    Type: String
    Default: ''
    Description: SPORE_OAUTH_SUCCESS_URL — where the OAuth callback redirects. Empty means https://spore.host/dashboard.

  TeamsAppId:
    Type: String
    Default: ''
    Description: TEAMS_APP_ID — Microsoft Teams bot app id. Empty disables Teams.

  TeamsAppSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: TEAMS_APP_SECRET — Microsoft Teams bot app secret.

  TeamsTenantId:
    Type: String
    Default: ''
    Description: TEAMS_TENANT_ID — required for single-tenant Teams apps; empty uses botframework.com.

  TwilioAccountSid:
    Type: String
    Default: ''
    Description: TWILIO_ACCOUNT_SID — empty disables SMS notifications.

  TwilioAuthToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: TWILIO_AUTH_TOKEN.

  TwilioNumberSpore:
    Type: String
    Default: ''
    Description: TWILIO_NUMBER_SPORE — the sending number for the /spore project (E.164).

Conditions:
  DeployLambda: !Not [!Equals [!Ref LambdaCodeBucket, '']]

Resources:

  # ── DynamoDB: instance registry ──────────────────────────────────────────────

  BotRegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: spore-bot-registry
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_key
          AttributeType: S
        - AttributeName: nickname
          AttributeType: S
        - AttributeName: instance_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_key
          KeyType: HASH
        - AttributeName: nickname
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: instance_id-index
          KeySchema:
            - AttributeName: instance_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: spore-bot

  # ── DynamoDB: workspace OAuth tokens ─────────────────────────────────────────

  BotWorkspacesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: spore-bot-workspaces
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      AttributeDefinitions:
        - AttributeName: workspace_key
          AttributeType: S
      KeySchema:
        - AttributeName: workspace_key
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: spore-bot

  # ── KMS key: workspace signing secrets ───────────────────────────────────────
  # The signing_secret attribute of spore-bot-workspaces is encrypted with this
  # key by every writer (spawn's pkg/botsecret: `spawn notify workspace add`, the
  # dashboard's Slack OAuth install; spore-bot's admin API) and decrypted by
  # spore-bot to verify requests (#868). Ciphertexts carry the encryption context
  # {purpose: spore-bot-signing-secret, workspace_key: <item key>}; the grants
  # below condition on purpose so they cover this use only. Deleted with the
  # stack (CloudFormation schedules key deletion after PendingWindowInDays).
  # The table's own SSE (aws/dynamodb) is a separate, AWS-managed key.

  BotSecretsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      Description: spore-bot workspace signing secrets (spore-bot-workspaces.signing_secret)
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          # Standard default: delegate to IAM in this account, so the role
          # policies below (and an operator's admin policy, for `spawn notify
          # workspace add`) are what grant use of the key.
          - Sid: EnableIAMPolicies
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: spore-bot

  BotSecretsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/spore-bot-secrets  # pkg/botsecret.DefaultKeyAlias
      TargetKeyId: !Ref BotSecretsKey

  # ── Audit Log Table ───────────────────────────────────────────────────────────

  BotAuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: spore-bot-audit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: audit_id
          AttributeType: S
        - AttributeName: user_key
          AttributeType: S
        - AttributeName: ts
          AttributeType: S
      KeySchema:
        - AttributeName: audit_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_key-ts-index
          KeySchema:
            - AttributeName: user_key
              KeyType: HASH
            - AttributeName: ts
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: spore-bot
        - Key: Component
          Value: audit

  # ── DynamoDB: pending SMS replies ────────────────────────────────────────────
  # sms_notify.go writes one item per outbound SMS (key "<from>#<to>", 15-minute
  # ttl) so a reply can be matched to its instance. The reply side is spore-host's
  # rest-api, not this bot. Missing before spawn#1043, so a self-hosted bot's
  # PutItem failed — silently, because the caller discards the error.

  SmsPendingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: spore-sms-pending
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pending_key
          AttributeType: S
      KeySchema:
        - AttributeName: pending_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: spore-bot

  # ── Lambda ────────────────────────────────────────────────────────────────────

  SporeBotFunction:
    Type: AWS::Serverless::Function
    Condition: DeployLambda
    Properties:
      FunctionName: spore-bot
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      Timeout: 120  # start command polls up to 90s for instance to reach running state
      MemorySize: 256
      Tracing: Active  # matches the hosted function; SAM adds the xray:Put* grants
      CodeUri:
        Bucket: !Ref LambdaCodeBucket
        Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          BOT_REGISTRY_TABLE: !Ref BotRegistryTable
          BOT_WORKSPACES_TABLE: !Ref BotWorkspacesTable
          BOT_AUDIT_TABLE: !Ref BotAuditTable
          BOT_CONNECT_CODE_TTL_HOURS: !Ref ConnectCodeTTLHours
          BOT_SLASH_COMMAND: !Ref SlashCommand
          DISCORD_PUBLIC_KEY: !Ref DiscordPublicKey
          SLACK_SIGNING_SECRET: !Ref SlackSigningSecret
          BOT_OAUTH_SECRET: !Ref BotOAuthSecret
          SPORE_SLACK_CLIENT_ID: !Ref SlackClientId
          SPORE_SLACK_CLIENT_SECRET: !Ref SlackClientSecret
          SPORE_OAUTH_SUCCESS_URL: !Ref OAuthSuccessUrl
          TEAMS_APP_ID: !Ref TeamsAppId
          TEAMS_APP_SECRET: !Ref TeamsAppSecret
          TEAMS_TENANT_ID: !Ref TeamsTenantId
          TWILIO_ACCOUNT_SID: !Ref TwilioAccountSid
          TWILIO_AUTH_TOKEN: !Ref TwilioAuthToken
          TWILIO_NUMBER_SPORE: !Ref TwilioNumberSpore
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BotRegistryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BotWorkspacesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BotAuditTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt SmsPendingTable.Arn
            # Decrypt to verify requests; Encrypt for workspaces written
            # through the admin API. Scoped to the key and to its one purpose.
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
              Resource: !GetAtt BotSecretsKey.Arn
              Condition:
                StringEquals:
                  'kms:EncryptionContext:purpose': spore-bot-signing-secret
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: 'arn:aws:iam::*:role/SpawnBotCrossAccount'
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:spore-bot'
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/spore-bot*'
      Tags:
        Environment: !Ref Environment
        Application: spore-bot

  SporeBotFunctionUrl:
    Type: AWS::Lambda::Url
    Condition: DeployLambda
    Properties:
      # trivy:ignore:AVD-AWS-0066 -- AuthType NONE is intentional; each route
      # authenticates in the Lambda (Slack HMAC, Discord Ed25519, Teams JWT, the
      # OAuth state HMAC).
      AuthType: NONE
      TargetFunctionArn: !GetAtt SporeBotFunction.Arn
      Cors:
        AllowOrigins: ['*']
        # GET for /<platform>/oauth and /<platform>/oauth/callback; matches the
        # hosted Function URL.
        AllowMethods: [POST, GET]

  SporeBotFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: DeployLambda
    Properties:
      FunctionName: !Ref SporeBotFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  # ── Admin API (AWS_IAM auth) ─────────────────────────────────────────────────
  # Separate API Gateway HTTP API for /admin/* routes used by the prism CLI and
  # spawn CLI. SigV4-signed requests only — AWS verifies the caller's IAM identity
  # before the Lambda sees the request.

  SporeBotAdminApi:
    Type: AWS::ApiGatewayV2::Api
    Condition: DeployLambda
    Properties:
      Name: !Sub '${AWS::StackName}-admin'
      ProtocolType: HTTP
      Description: 'spore-bot admin API — workspace and registration management (IAM auth)'

  SporeBotAdminApiDefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Condition: DeployLambda
    Properties:
      ApiId: !Ref SporeBotAdminApi
      StageName: '$default'
      AutoDeploy: true

  SporeBotAdminApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: DeployLambda
    Properties:
      ApiId: !Ref SporeBotAdminApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SporeBotFunction.Arn
      PayloadFormatVersion: '2.0'

  SporeBotAdminApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: DeployLambda
    Properties:
      ApiId: !Ref SporeBotAdminApi
      RouteKey: '$default'
      AuthorizationType: AWS_IAM
      Target: !Sub 'integrations/${SporeBotAdminApiIntegration}'

  SporeBotAdminApiPermission:
    Type: AWS::Lambda::Permission
    Condition: DeployLambda
    Properties:
      FunctionName: !Ref SporeBotFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SporeBotAdminApi}/*/*'

Outputs:
  BotRegistryTableName:
    Value: !Ref BotRegistryTable
    Export:
      Name: !Sub '${AWS::StackName}-registry-table'

  BotWorkspacesTableName:
    Value: !Ref BotWorkspacesTable
    Export:
      Name: !Sub '${AWS::StackName}-workspaces-table'

  BotAuditTableName:
    Value: !Ref BotAuditTable
    Export:
      Name: !Sub '${AWS::StackName}-audit-table'

  SmsPendingTableName:
    Value: !Ref SmsPendingTable
    Export:
      Name: !Sub '${AWS::StackName}-sms-pending-table'

  BotSecretsKeyArn:
    Value: !GetAtt BotSecretsKey.Arn
    Description: 'KMS key for workspace signing secrets (alias/spore-bot-secrets). Grant kms:Encrypt on it to principals that write workspaces (e.g. the dashboard role).'
    Export:
      Name: !Sub '${AWS::StackName}-secrets-key-arn'

  LambdaFunctionUrl:
    Condition: DeployLambda
    Value: !GetAtt SporeBotFunctionUrl.FunctionUrl
    Description: 'Interactions endpoint base — append /slack, /teams, /discord or /notify (self-hosted spawn launches: set SPORE_NOTIFY_URL to this URL, no path)'
    Export:
      Name: !Sub '${AWS::StackName}-function-url'

  AdminApiUrl:
    Condition: DeployLambda
    Value: !Sub 'https://${SporeBotAdminApi}.execute-api.${AWS::Region}.amazonaws.com'
    Description: 'Admin API URL (AWS_IAM auth) — used by prism CLI and spawn bot commands'
    Export:
      Name: !Sub '${AWS::StackName}-admin-api-url'
