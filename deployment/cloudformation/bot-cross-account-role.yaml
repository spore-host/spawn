AWSTemplateFormatVersion: '2010-09-09'
# EXPERIMENTAL — UNSUPPORTED IN 1.0, like spore-bot.yaml, which it serves
# (spore-host/spore-host#611). `spawn notify register` needs
# SPAWN_EXPERIMENTAL_CHAT=1.
#
# spore.host no longer hosts a bot, so this template has no default principal
# and no default ExternalId: BotLambdaRoleArn must name YOUR self-hosted
# spore-bot's execution role, and ExternalId must be a value of your own. The
# old defaults (the hosted spore-bot-role, and the shared "<prefix>-bot"
# ExternalId when none was given) trusted a bot that no longer exists.
Description: >
  Cross-account IAM role that allows a self-hosted spore-bot Lambda to perform
  EC2 operations on instances in this account.

  Deploy this template in each AWS account that has instances you want to control
  via the Slack/Teams bot. The RoleArn output goes into `spawn bot register --role-arn`.

Parameters:
  BotLambdaRoleArn:
    Type: String
    # No Default: the hosted spore-bot's role is retired (spore-host#611), and
    # bot_principal_test.go fails CI if a default principal comes back.
    Description: >
      ARN of your self-hosted spore-bot Lambda's execution role (the same value
      as SPORE_BOT_LAMBDA_ROLE_ARN for `spawn notify register`). Required:
      spore.host no longer hosts a bot.
    AllowedPattern: 'arn:aws:iam::\d{12}:role/.+'
    ConstraintDescription: Must be a valid IAM role ARN

  TagPrefix:
    Type: String
    Default: spawn
    AllowedValues:
      - spawn
      - prism
    Description: >
      Tag namespace for instances managed by this bot.
      Use "spawn" for spore.host instances (spawn:managed=true),
      or "prism" for prism instances (prism:managed=true).

  RoleName:
    Type: String
    Default: SpawnBotCrossAccount
    Description: Name of the cross-account IAM role to create

  ExternalId:
    Type: String
    # No Default and no fallback: the legacy shared "<prefix>-bot" value is
    # one spore-bot no longer presents (spore-host#413), so a role trusting it
    # could never be assumed (spore-host#611).
    MinLength: 16
    Description: >
      STS ExternalId the spore-bot Lambda must present when assuming this role.
      Required: a high-entropy value of your own (e.g. `openssl rand -hex 16`),
      one per account. Register instances with that same value:
      `spawn notify register --role-arn <RoleArn output> --external-id <value>`.

  ScopeStartStopByTag:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'false'
      - 'true'
    Description: >
      When "true", ec2:StartInstances/StopInstances are restricted to instances
      tagged managed=true under the tag prefix (e.g. "spawn:managed=true") — the
      tag spawn applies to every instance it launches. When "false" (default),
      those actions are allowed on all instances and access is gated only by the
      spore-bot registry. Set to "true" for defense-in-depth once you have
      confirmed all bot-controlled instances in this account carry the managed
      tag.

Conditions:
  ScopeByTag: !Equals [!Ref ScopeStartStopByTag, 'true']
  IsPrism: !Equals [!Ref TagPrefix, 'prism']

Resources:

  BotCrossAccountRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: !Sub 'Allows spore-bot Lambda to control ${TagPrefix}-managed EC2 instances'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref BotLambdaRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                # The per-account ExternalId; there is no shared fallback
                # (spore-host#413, #611).
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: BotEC2Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read instance state and metadata (needed for status/url commands)
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                  - ec2:DescribeInstanceStatus
                Resource: '*'
              # Start/stop/hibernate. With ScopeStartStopByTag=true these are
              # restricted to ${TagPrefix}:managed=true instances; otherwise
              # Resource "*" and access is enforced by the spore-bot DynamoDB
              # registry (enabled flag per registration).
              - !If
                - ScopeByTag
                - Effect: Allow
                  Action:
                    - ec2:StartInstances
                    - ec2:StopInstances
                  Resource: '*'
                  # IAM Condition map keys must be literal strings (no Fn::Sub),
                  # so select the whole key by TagPrefix (spawn|prism).
                  Condition:
                    StringEquals:
                      !If
                        - IsPrism
                        - 'aws:ResourceTag/prism:managed': 'true'
                        - 'aws:ResourceTag/spawn:managed': 'true'
                - Effect: Allow
                  Action:
                    - ec2:StartInstances
                    - ec2:StopInstances
                  # trivy:ignore:AVD-AWS-0057 -- Resource * is intentional when
                  # ScopeStartStopByTag=false; access control is enforced by the
                  # spore-bot DynamoDB registry (enabled flag per registration).
                  Resource: '*'
      Tags:
        - Key: !Sub '${TagPrefix}:managed'
          Value: 'false'
        - Key: Purpose
          Value: spore-bot-cross-account
        - Key: BotLambdaRoleArn
          Value: !Ref BotLambdaRoleArn

Outputs:
  RoleArn:
    Description: >
      Pass this ARN to `spawn bot register --role-arn` when registering instances
      in this account with the spore-bot.
    Value: !GetAtt BotCrossAccountRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-role-arn'

  ExternalId:
    Description: >
      External ID required when assuming this role (the per-account value).
    Value: !Ref ExternalId
