AWSTemplateFormatVersion: '2010-09-09'
Description: 'IAM role for spawn scheduler-handler Lambda function'

Parameters:
  Environment:
    Type: String
    Default: production
    Description: Environment name

Resources:
  SchedulerHandlerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SpawnSchedulerHandlerExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SchedulerHandlerPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # DynamoDB - Read/Write to schedules and history tables
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/spawn-schedules'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/spawn-schedules/index/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/spawn-schedule-history'

              # S3 - Read parameter files from spawn-schedules-* buckets. Wildcarded
              # because the CLI falls back to an account-scoped
              # spawn-schedules-<account>-<region> when the shared name is taken
              # (#804), and the schedule's region need not be this function's.
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - 'arn:aws:s3:::spawn-schedules-*/schedules/*'

              # Start the sweep the way `spawn launch --param-file` does (#1026):
              # stage the params where the orchestrator's role can read them,
              # write the record it loads, then invoke it. The orchestrator and
              # its table and bucket live in its own region (us-east-1), not
              # necessarily this function's.
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - 'arn:aws:s3:::spawn-sweeps-*/sweeps/*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:*:${AWS::AccountId}:table/spawn-sweep-orchestration'

              # Lambda - Invoke the orchestrator. Named sweep-orchestrator here
              # until #1026, after the code was corrected to the deployed
              # spawn-sweep-orchestrator in #812.
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub 'arn:aws:lambda:*:${AWS::AccountId}:function:spawn-sweep-orchestrator'

              # CloudWatch Logs - Create and write logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/scheduler-handler'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/scheduler-handler:*'

      Tags:
        - Key: Application
          Value: spawn
        - Key: Component
          Value: scheduler
        - Key: Environment
          Value: !Ref Environment

Outputs:
  RoleArn:
    Description: ARN of the scheduler-handler execution role
    Value: !GetAtt SchedulerHandlerExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-role-arn'

  RoleName:
    Description: Name of the scheduler-handler execution role
    Value: !Ref SchedulerHandlerExecutionRole
    Export:
      Name: !Sub '${AWS::StackName}-role-name'
