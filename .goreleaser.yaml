# GoReleaser configuration for spore-host/spawn
version: 2

# Build the ttl-reaper Lambda zip and attach it to the release (spawn#625). The
# reaper is a SEPARATE go module (lambda/ttl-reaper), so GoReleaser's own `builds:`
# (which build the root module) can't produce it — hence a before-hook, mirroring
# lambda/ttl-reaper/Makefile's `build` target. The zip is attached via
# `release.extra_files` below, so `spawn reaper deploy` can pull it straight from the
# GitHub Release and upload it into the user's own account. Without a published
# artifact there is no way to self-host the reaper, which is the whole of #625: an
# account that forbids cross-account trust can otherwise have no backstop at all.
#
# Build the PACKAGE (`.`), NOT `main.go`. Naming files compiles only those files, and
# the reaper is three (main.go, expiry.go, failures.go) — `go build main.go` fails
# outright here with "undefined: accountOutcome". The Makefile carries the same
# warning for the same reason (#466). Note lagotto's equivalent hook does use
# `main.go`; its lambda is currently single-file so it works by luck, and will break
# the day it isn't. Filed separately.
#
# `zip -j` so `bootstrap` sits at the zip root: Lambda resolves the handler from the
# archive root, and a nested path yields a Runtime.InvalidEntrypoint at invoke time —
# after a successful deploy, which is the worst place to find out.
before:
  hooks:
    - sh -c "cd lambda/ttl-reaper && GOOS=linux GOARCH=arm64 go build -tags lambda.norpc -o bootstrap . && zip -j ttl-reaper_lambda_linux_arm64.zip bootstrap"

builds:
  - id: spawn
    main: .
    binary: spawn
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/spore-host/spawn/cmd.Version={{.Version}}
      - -X github.com/spore-host/spawn/cmd.GitCommit={{.Commit}}
      - -X github.com/spore-host/spawn/cmd.BuildDate={{.Date}}
    mod_timestamp: '{{ .CommitTimestamp }}'

  - id: spored
    main: ./cmd/spored
    binary: spored
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Windows EC2 is amd64-only in practice; skip windows/arm64.
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: spawn-archive
    ids:
      - spawn
    name_template: 'spawn_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE*

  - id: spored-archive
    ids:
      - spored
    name_template: 'spored_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

# Publisher-authenticate the release with keyless cosign (Sigstore). We sign the
# checksums.txt — it lists the SHA-256 of every archive/package, so one signature
# transitively authenticates all artifacts (verify the checksum's signature, then
# each file against checksums.txt). Keyless uses the release workflow's GitHub OIDC
# identity via Fulcio/Rekor — no long-lived key to manage or leak.
#
# NOTE: this signs the CLI GoReleaser artifacts (spawn tarballs/packages). It is
# SEPARATE from spored publisher-signing, which is KMS-signed + boot-verified via
# the S3-upload step in the release workflow (spore-host#440) — untouched here.
#
# cosign 3.x emits the modern Sigstore bundle (`--bundle`, bundling signature +
# Fulcio cert + Rekor entry); the old --output-signature/--output-certificate are
# gone. Publishes checksums.txt.bundle. Requires `id-token: write` + cosign on PATH.
# Verify with `cosign verify-blob --bundle` (see docs: "Verify a download").
signs:
  - cmd: cosign
    signature: '${artifact}.bundle'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'typo'
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

nfpms:
  - id: spawn-pkg
    package_name: spawn
    ids:
      - spawn
    vendor: spore.host
    homepage: https://spore.host
    maintainer: "spore.host <hello@spore.host>"
    description: "Launch ephemeral AWS EC2 instances effortlessly"
    license: Apache-2.0
    formats:
      - deb
      - rpm
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    contents:
      - src: LICENSE
        dst: /usr/share/doc/spawn/copyright
        type: doc
    rpm:
      summary: "Launch ephemeral AWS EC2 instances effortlessly"

  - id: spored-pkg
    package_name: spored
    ids:
      - spored
    vendor: spore.host
    homepage: https://spore.host
    maintainer: "spore.host <hello@spore.host>"
    description: "Background monitoring daemon for spawn-managed EC2 instances"
    license: Apache-2.0
    formats:
      - deb
      - rpm
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    contents:
      - src: LICENSE
        dst: /usr/share/doc/spored/copyright
        type: doc
    rpm:
      summary: "Background monitoring daemon for spawn-managed EC2 instances"

brews:
  - name: spawn
    ids:
      - spawn-archive
    repository:
      owner: spore-host
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/spore-host/spawn
    description: "Launch ephemeral AWS EC2 instances effortlessly"
    license: Apache-2.0
    dependencies:
      - name: spore-host/tap/truffle
        type: runtime
    test: |
      system "#{bin}/spawn", "version"
    install: |
      bin.install "spawn"

scoops:
  - name: spawn
    ids:
      - spawn-archive
    repository:
      owner: spore-host
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/spore-host/spawn
    description: "Launch ephemeral AWS EC2 instances effortlessly"
    license: Apache-2.0
    depends:
      - spore-host/truffle

release:
  github:
    owner: spore-host
    name: spawn
  draft: false
  prerelease: auto
  mode: replace
  name_template: "v{{.Version}}"
  # Attach the ttl-reaper Lambda zip built by the before-hook, so it is an
  # end-user-pullable release asset (#625). `spawn reaper deploy` downloads this and
  # uploads it into a bucket in the caller's own account — no spore.host infra
  # account, and no cross-account trust, which is the point.
  extra_files:
    - glob: ./lambda/ttl-reaper/ttl-reaper_lambda_linux_arm64.zip
